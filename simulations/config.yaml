# ═══════════════════════════════════════════════════════════════════════
# Unified Simulation Pipeline Configuration
# ═══════════════════════════════════════════════════════════════════════
# Single source of truth for the H5N1 B3.13 cattle epidemic simulation
# pipeline: model parameters, ABC calibration, and downstream scenarios.

# ── Data paths (relative to this file's directory) ──
data:
  county_data: data/dairy_cows_by_counties.csv
  network_dir: data/networks/

# ── Timeline constants ──
timeline:
  tx_detection_date: "2024-03-25"
  tx_detection_doy: 85          # day-of-year for TX detection (2024 is leap year)
  tx_to_npi_days: 35            # March 25 → April 29
  tmrca_offset_min: 79          # Jan 6, 2024 → Mar 25, 2024
  tmrca_offset_max: 137         # Nov 9, 2023 → Mar 25, 2024
  tmrca_offset_default: 102     # Dec 14, 2023 → Mar 25, 2024

# ── Model defaults ──
model:
  seed_county: 48069            # Castro County, TX (FIPS)
  num_days: 830                 # tmrca_offset (~100) + 730 (24 months)
  master_seed: 42

# ── Observed data (APHIS) ──
# Days after TX first detection. D1.1 states (AZ, NV, WI) excluded.
# OR excluded — no cattle outbreak.
observed:
  first_detection_days:
    TX: 0
    KS: 1
    MI: 4
    NM: 7
    ID: 8
    OH: 8
    NC: 15
    SD: 15
    CO: 31
    MN: 72
    WY: 73
    IA: 74
    OK: 108
    CA: 158
    UT: 220
    NE: 539

  outbreak_counts:
    CA: 773
    CO: 64
    ID: 108
    IA: 13
    KS: 4
    MI: 31
    MN: 9
    NE: 1
    NM: 9
    NC: 1
    OH: 1
    OK: 2
    SD: 7
    TX: 30
    UT: 13
    WY: 1

# ── ABC-SMC calibration ──
abc:
  prior_bounds:
    beta:         [0.001, 0.05]
    alpha:        [0.0, 1.0]
    gamma:        [0.0, 1.0]
    mu_c:         [7, 59]
    npi_factor:   [0.0, 1.0]
    tmrca_offset: [79, 137]

  integer_params: [mu_c, tmrca_offset]

  smc:
    num_rounds: 4
    num_proposals: 1500
    acceptance_quantile: 0.05   # top 5% = 75 particles
    network_pool_size: 50
    networks_per_proposal: 3
    sims_per_network: 2

  distance:
    mode: intensity             # 'timing' or 'intensity'
    missing_penalty: 2.0
    early_late_split_days: 30
    include_intensity: true
    trajectories_per_proposal: 6

# ── ABC sensitivity axes ──
# 4 axes, 8 total runs (vary one axis from baseline at a time)
abc_sensitivity:
  axes:
    missing_penalty: [1.0, 2.0, 5.0]
    early_late_split_days: [20, 30, 45]
    trajectories_per_proposal: [6, 15]
    include_intensity: [true, false]
  baseline:
    missing_penalty: 2.0
    early_late_split_days: 30
    trajectories_per_proposal: 6
    include_intensity: true

# ── Downstream simulation defaults ──
simulation:
  num_networks: 1000
  num_sims: 5
  batch_size: 50
  seed: 42
  save_transmission_log: true

