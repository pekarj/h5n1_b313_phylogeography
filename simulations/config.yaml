  # TX statewide: all 148 TX dairy counties (computed at runtime from county data)

# ── Seed states for alternative origin analysis ──
alternative_origins:
  seed_states: [TX, CA, ID, IA, NM, KS, SD, CO, OH, NC, MI, MN, WY, OK, NE, UT]
  connectivity_tiers: [high, low]
  npi_conditions: [npi, no_npi]
  n_sample_nets_for_pools: 20

# ── All-county alternative origin analysis ──
all_county_origins:
  npi_conditions: [npi]
  num_networks: 200

# ═══════════════════════════════════════════════════════════════════════
# Scenario definitions
# ═══════════════════════════════════════════════════════════════════════
# Each scenario has:
#   npis: list of NPI layers, each with target, factor, delay
#   description: human-readable
#   seed_county: override (default: model.seed_county)
#
# NPI layer targets:
#   interstate    — src and dest in different states
#   intrastate    — src and dest in same state
#   from_states   — src county in listed states
#   from_counties — src county in listed FIPS set
#   to_states     — dest county in listed states
#   all           — every edge
#
# factor: float (0-1) or 'posterior' (use ABC posterior npi_factor)
# delay: delay_post_tx (days after TX detection) or delay_post_tmrca (days after tMRCA)
#
# Layers stack multiplicatively: if two layers match an edge,
# effective_factor = layer1.factor * layer2.factor

scenarios:
  # ── A. NPI timing counterfactuals ──
  npi_timing:
    npi_day0:
      description: "Interstate NPI at TX detection"
      npis:
        - {target: interstate, factor: posterior, delay_post_tx: 0}
    npi_day4:
      description: "Interstate NPI 4 days after TX detection"
      npis:
        - {target: interstate, factor: posterior, delay_post_tx: 4}
    npi_day8:
      description: "Interstate NPI 8 days after TX detection"
      npis:
        - {target: interstate, factor: posterior, delay_post_tx: 8}
    npi_day16:
      description: "Interstate NPI 16 days after TX detection"
      npis:
        - {target: interstate, factor: posterior, delay_post_tx: 16}
    npi_day35:
      description: "Interstate NPI at actual federal order (day 35)"
      npis:
        - {target: interstate, factor: posterior, delay_post_tx: 35}
    no_npi:
      description: "No NPI baseline"
      npis: []

  # ── B. NPI strength sweep (at actual timing, day 35) ──
  strength_sweep:
    strength_f010:
      description: "90% interstate reduction at day 35"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tx: 35}
    strength_f030:
      description: "70% interstate reduction at day 35"
      npis:
        - {target: interstate, factor: 0.3, delay_post_tx: 35}
    strength_f050:
      description: "50% interstate reduction at day 35"
      npis:
        - {target: interstate, factor: 0.5, delay_post_tx: 35}
    strength_f070:
      description: "30% interstate reduction at day 35"
      npis:
        - {target: interstate, factor: 0.7, delay_post_tx: 35}
    strength_f090:
      description: "10% interstate reduction at day 35"
      npis:
        - {target: interstate, factor: 0.9, delay_post_tx: 35}

  # ── C. Early + strong ──
  early_strong:
    day0_f010:
      description: "90% interstate reduction at TX detection"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tx: 0}
    day16_f010:
      description: "90% interstate reduction at day 16"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tx: 16}

  # ── D. Early surveillance (relative to tMRCA, not TX detection) ──
  early_surveillance:
    tmrca_30d:
      description: "90% interstate reduction 30d after tMRCA"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tmrca: 30}
    tmrca_7d:
      description: "90% interstate reduction 7d after tMRCA"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tmrca: 7}
    tmrca_14d:
      description: "90% interstate reduction 14d after tMRCA"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tmrca: 14}
    tmrca_60d:
      description: "90% interstate reduction 60d after tMRCA"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tmrca: 60}

  # ── E. Within-state interventions ──
  within_state:
    within50_between_posterior:
      description: "50% intrastate + posterior interstate at day 35"
      npis:
        - {target: interstate, factor: posterior, delay_post_tx: 35}
        - {target: intrastate, factor: 0.5, delay_post_tx: 35}
    within90_between_posterior:
      description: "90% intrastate + posterior interstate at day 35"
      npis:
        - {target: interstate, factor: posterior, delay_post_tx: 35}
        - {target: intrastate, factor: 0.1, delay_post_tx: 35}
    within90_between90:
      description: "90% intrastate + 90% interstate at day 35"
      npis:
        - {target: interstate, factor: 0.1, delay_post_tx: 35}
        - {target: intrastate, factor: 0.1, delay_post_tx: 35}

  # ── F. Alternative origins ──
  # Generated programmatically from alternative_origins config above.
  # 16 states × 2 tiers × 2 NPI = 64 scenarios.
  # Each scenario seeds from a connectivity pool within the origin state.
  # NPI condition 'npi' uses: [{target: interstate, factor: posterior, delay_post_tx: 35}]
  # NPI condition 'no_npi' uses: []

  # ── G. Targeted containment scenarios ──
  # 7 perimeters × 4 timing points = 28 scenarios + 1 standard federal order = 29
  # All use 90% reduction (factor: 0.1) on outbound edges from containment zone.

  targeted_containment:
    # ── Castro only ──
    castro_tmrca14:
      description: "90% outbound reduction from Castro at tMRCA+14d"
      npis: [{target: from_counties, county_set: castro, factor: 0.1, delay_post_tmrca: 14}]
    castro_tmrca30:
      description: "90% outbound reduction from Castro at tMRCA+30d"
      npis: [{target: from_counties, county_set: castro, factor: 0.1, delay_post_tmrca: 30}]
    castro_tmrca60:
      description: "90% outbound reduction from Castro at tMRCA+60d"
      npis: [{target: from_counties, county_set: castro, factor: 0.1, delay_post_tmrca: 60}]
    castro_detect:
      description: "90% outbound reduction from Castro at TX detection"
      npis: [{target: from_counties, county_set: castro, factor: 0.1, delay_post_tx: 0}]

    # ── Panhandle (26 counties, 14 dairy) ──
    panhandle_tmrca14:
      description: "90% outbound reduction from panhandle at tMRCA+14d"
      npis: [{target: from_counties, county_set: panhandle, factor: 0.1, delay_post_tmrca: 14}]
    panhandle_tmrca30:
      description: "90% outbound reduction from panhandle at tMRCA+30d"
      npis: [{target: from_counties, county_set: panhandle, factor: 0.1, delay_post_tmrca: 30}]
    panhandle_tmrca60:
      description: "90% outbound reduction from panhandle at tMRCA+60d"
      npis: [{target: from_counties, county_set: panhandle, factor: 0.1, delay_post_tmrca: 60}]
